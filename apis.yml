name: BlindInsight
description: >-
  BlindInsight (Blind Insight) is an end-to-end encrypted datastore and
  privacy-preserving data-analysis platform. It lets teams encrypt, ingest,
  search, and run machine learning and LLM queries over fully encrypted records
  without ever exposing plaintext, using a locally deployed Blind Proxy that
  transparently performs client-side encryption and decryption against the cloud
  REST API. The platform provides schema-constrained encrypted fields, searchable
  encryption, key sharing and keyring management, role- and team-based access
  grants, organization and user management, resumable batch ingestion, and a
  BlindLLM interface for prompting models over protected data — aimed at
  regulated, compliance-sensitive workloads.
