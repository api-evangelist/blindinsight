openapi: 3.0.3
info:
  title: Blind Insight REST API
  version: 10.22.0
  description: End-to-end encrypted datastore
paths:
  /api/accounts/change-password/:
    post:
      operationId: accounts_change-password
      description: |-
        Change the password of the currently authenticated user. The `old_password`
        field must match the currently set password. The `password` and
        `password_confirm` fields must match.

        The response will be a detail message indicating if the password change was
        successful.

        **On the command line:**

        ```bash
        blind accounts change-password --data password-change.json
        ```
      summary: Change user password
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChanged'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangedError'
          description: ''
  /api/accounts/login/:
    post:
      operationId: accounts_login
      description: |-
        Log in a user using their email and password. On success, returns a JSON web
        token which should be included in the `Authorization` header for all subsequent
        API requests in client implementations.

        The response will be a detail message indicating if the login was successful.

        **On the command line:**

        ```bash
        blind accounts login --data login.json
        ```
      summary: Login a user account
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefaultLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DefaultLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DefaultLogin'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessful'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessfulError'
          description: ''
  /api/accounts/logout/:
    post:
      operationId: accounts_logout
      description: |-
        Log out the currently authenticated user. This simply invalidates the JSON web
        token used.

        This is separate from the porcelain `blind logout` command which removes stored
        credentials on the local machine.

        The response will be a detail message indicating if the logout was successful.

        **On the command line:**

        ```bash
        blind accounts logout
        ```
      summary: Logout a user account
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccessful'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccessfulError'
          description: ''
  /api/accounts/profile/:
    get:
      operationId: accounts_profile_retrieve
      description: |-
        Retrieve the profile of the currently authenticated user.

        The response will be the profile object.

        **On the command line:**

        ```bash
        blind accounts profile retrieve
        ```
      summary: Get user profile
      tags:
      - accounts
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultUserProfile'
          description: ''
    post:
      operationId: accounts_profile_create
      description: |-
        Create a profile for the currently authenticated user. This is useful if you
        don't have a profile yet, or if you want to edit an existing profile.

        The response will be the newly created profile object.

        **On the command line:**

        ```bash
        blind accounts profile create --data profile.json
        ```
      summary: Create user profile
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefaultUserProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DefaultUserProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DefaultUserProfile'
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultUserProfile'
          description: ''
    put:
      operationId: accounts_profile_update
      description: |-
        Replace the currently authenticated user's profile with the data provided in
        the request. Fields not specified in the request will be dropped.

        The response will be the updated profile object.

        **On the command line:**

        ```bash
        blind accounts profile update --data profile.json
        ```
      summary: Update user profile
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefaultUserProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DefaultUserProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DefaultUserProfile'
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultUserProfile'
          description: ''
    patch:
      operationId: accounts_profile_partial-update
      description: |-
        Update one or more fields of the currently authenticated user's profile. This
        does not replace the entire profile, it only updates the fields provided in
        the request.

        The response will be the updated profile object.

        **On the command line:**

        ```bash
        blind accounts profile partial-update --data profile-update.json
        ```
      summary: Partially update user profile
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDefaultUserProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDefaultUserProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDefaultUserProfile'
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultUserProfile'
          description: ''
  /api/accounts/register/:
    post:
      operationId: accounts_register
      description: |-
        This endpoint registers a new user. The user will receive an email with a link to activate their account.

        This will also create a new Organization for the user. The user will be the owner of the organization.

        See the [user registration](https://docs.blindinsight.io/) documentation for more information.

        The response will be the newly created user object.

        **On the command line:**

        You can supply record data on standard input with the `--data -` or write it to
        a file and give the `--data <filename>` flag.

        ```bash
        blind accounts register --data '{
          "email": "demo@example.com",
          "first_name": "Demo",
          "last_name": "User",
          "organization_name": "Demo",
          "password": "pass1234",
          "password_confirm": "pass1234"
        }'
        ```
      summary: Register a new user account
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationRegisterUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationRegisterUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationRegisterUser'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUserProfile'
          description: ''
  /api/accounts/register-email/:
    post:
      operationId: accounts_register-email
      description: |-
        Register a new email address for the currently authenticated user. This is
        useful if the user wants to change email addresses associated with
        their account.

        The new email must be verified before it is associated with the account.

        The response will be a detail message indicating if the email was registered.

        **On the command line:**

        ```bash
        blind accounts register-email --data '{"email": "demo-example@example.com"}'
        ```
      summary: Register user email
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefaultRegisterEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DefaultRegisterEmail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DefaultRegisterEmail'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredEmail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredEmailError'
          description: ''
  /api/accounts/reset-password/:
    post:
      operationId: accounts_reset-password
      description: |-
        Reset the password of the given user using the provided signature and timestamp.

        This endpoint is generally only used by an administrator to reset a user's
        password.

        The response will be a detail message indicating if the password reset was
        successful.

        **On the command line:**

        ```bash
        blind accounts reset-password --data reset-password.json
        ```
      summary: Reset user password
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPassword'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordReset'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetError'
          description: ''
  /api/accounts/send-reset-password-link/:
    post:
      operationId: accounts_send-reset-password-link
      description: |-
        Send a password reset link email to the user with the given email address. This
        endpoint does not require the user to have activated their account yet.

        The response will be a detail message indicating if the reset link was sent.

        **On the command line:**

        ```bash
        blind accounts send-reset-password-link --data '{"email": "demo@example.com"}'
        ```
      summary: Send reset password link
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefaultSendResetPasswordLink'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DefaultSendResetPasswordLink'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DefaultSendResetPasswordLink'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordLinkSent'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordLinkSentError'
          description: ''
  /api/accounts/verify-email/:
    post:
      operationId: accounts_verify-email
      description: |-
        Verify the authenticated user's email address. This is useful if you want to
        automate onboarding of users within your organization.

        The response will be a detail message indicating if the verification was
        successful.

        **On the command line:**

        ```bash
        blind accounts verify-email --data verification.json
        ```
      summary: Verify user email
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedEmail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedEmailError'
          description: ''
  /api/accounts/verify-registration/:
    post:
      operationId: accounts_verify-registration
      description: |-
        This endpoint verifies a new user with their user ID, a timestamp, and a signature. These values must come from the received verification email.

        The response will be a detail message indicating if the verification was successful.

        **On the command line:**

        ```bash
        blind accounts verify-registration --data registration.json
        ```
      summary: Verify a new user account
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRegistration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyRegistration'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountVerified'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountVerifiedError'
          description: ''
  /api/blindllm-queries/:
    get:
      operationId: blindllm_queries_list
      description: |-
        API for BlindLLM analyst queries.

        list:     Returns prior queries scoped to the user's organizations.
        retrieve: One query by id.
        create:   Run an analyst query against the org's encrypted data via
                  the configured Cloud Proxy. Falls back to deterministic mock
                  tool handlers when the org has no `blindllm` proxy credentials.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - blindllm-queries
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBlindLLMQueryList'
          description: ''
    post:
      operationId: blindllm_queries_create
      description: |-
        API for BlindLLM analyst queries.

        list:     Returns prior queries scoped to the user's organizations.
        retrieve: One query by id.
        create:   Run an analyst query against the org's encrypted data via
                  the configured Cloud Proxy. Falls back to deterministic mock
                  tool handlers when the org has no `blindllm` proxy credentials.
      tags:
      - blindllm-queries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlindLLMQueryCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BlindLLMQueryCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BlindLLMQueryCreate'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlindLLMQueryCreate'
          description: ''
  /api/blindllm-queries/{id}/:
    get:
      operationId: blindllm_queries_retrieve
      description: |-
        API for BlindLLM analyst queries.

        list:     Returns prior queries scoped to the user's organizations.
        retrieve: One query by id.
        create:   Run an analyst query against the org's encrypted data via
                  the configured Cloud Proxy. Falls back to deterministic mock
                  tool handlers when the org has no `blindllm` proxy credentials.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this Blind LLM query.
        required: true
      tags:
      - blindllm-queries
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlindLLMQuery'
          description: ''
  /api/blindllm/chat/:
    post:
      operationId: blindllm_chat_create
      description: Anonymous, IP-rate-limited demo endpoint used by blindinsight.com
        to drive the homepage chat experience. Runs the orchestrator against a single
        configured demo organization.
      summary: Public BlindLLM demo (marketing site)
      tags:
      - blindllm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlindLLMDemoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BlindLLMDemoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BlindLLMDemoRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlindLLMDemoResponse'
          description: ''
        '400':
          description: No response body
        '429':
          description: No response body
        '503':
          description: No response body
  /api/blindllm/demo/:
    post:
      operationId: blindllm_demo_create
      description: Anonymous, IP-rate-limited demo endpoint used by blindinsight.com
        to drive the homepage chat experience. Runs the orchestrator against a single
        configured demo organization.
      summary: Public BlindLLM demo (marketing site)
      tags:
      - blindllm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlindLLMDemoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BlindLLMDemoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BlindLLMDemoRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlindLLMDemoResponse'
          description: ''
        '400':
          description: No response body
        '429':
          description: No response body
        '503':
          description: No response body
  /api/blindllm/inspect/:
    get:
      operationId: blindllm_inspect_retrieve
      description: Returns the demo organization's derived Dataset/Schema catalog
        so blindinsight.com can render /datasets inspect and /schemas inspect without
        a duplicated static catalog.
      summary: Public BlindLLM schema catalog inspect
      tags:
      - blindllm
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlindLLMInspectResponse'
          description: ''
        '503':
          description: No response body
  /api/blindllm/models/:
    get:
      operationId: blindllm_models_retrieve
      description: Lists the provider selector ids accepted by BlindLLM demo endpoints.
      summary: Supported BlindLLM model selectors
      tags:
      - blindllm
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/csrf/:
    get:
      operationId: csrf_retrieve
      description: Retrieve a CSRF token.
      summary: Retrieve a CSRF token
      tags:
      - csrf
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken:
                    type: string
          description: ''
  /api/datasets/:
    get:
      operationId: datasets_list
      description: Retrieve a list of datasets. You can filter the list by providing
        query parameters.
      summary: Retrieve a list of Dataset objects, with filters
      parameters:
      - in: query
        name: description
        schema:
          type: string
        description: A longer description of the dataset.
      - in: query
        name: id
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
        description: A human-readable name for this dataset.
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: organization
        schema:
          type: string
        description: The organization that this dataset belongs to.
      - in: query
        name: slug
        schema:
          type: string
        description: A unique slug for this dataset.
      tags:
      - datasets
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDatasetList'
          description: ''
    post:
      operationId: datasets_create
      description: Create a new dataset.
      summary: Create a new Dataset
      tags:
      - datasets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dataset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Dataset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Dataset'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
          description: ''
  /api/datasets/{id}/:
    get:
      operationId: datasets_retrieve
      description: Retrieve one dataset.
      summary: Retrieve one Dataset object
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this dataset.
        required: true
      tags:
      - datasets
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
          description: ''
    put:
      operationId: datasets_update
      description: Update an existing dataset.
      summary: Update a Dataset
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this dataset.
        required: true
      tags:
      - datasets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dataset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Dataset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Dataset'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
          description: ''
    patch:
      operationId: datasets_partial_update
      description: Update an existing dataset with only the specified fields.
      summary: Partially update a Dataset
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this dataset.
        required: true
      tags:
      - datasets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDataset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDataset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDataset'
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
