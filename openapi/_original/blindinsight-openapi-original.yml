  /api/records/:
    get:
      operationId: records_list
      description: |-
        List records for the given schema ID. Takes optional pagination parameters
        `limit` and `offset`, as well as an optional query filter `q`.

        The response will be a list of record objects.

        **On the command line:**

        ```bash
        blind records list --schema "<schema-id>"
        ```

        #
      summary: List records
      parameters:
      - in: query
        name: count_only
        schema:
          type: boolean
        description: 'Return only {"count": N} without records or pagination. Useful
          for fetching the total count asynchronously after an initial fast query.'
      - in: query
        name: include_count
        schema:
          type: boolean
        description: Deprecated. COUNT is now always included by default.
        deprecated: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: array
          items:
            type: string
        description: Query filter for records.
        explode: true
        style: form
        examples:
          PhraseSearchQuery:
            value: a3f1c2d4e5b6078910aabbccddeeff00=phrase:c0ffee00112233,deadbeef445566
            summary: Phrase search on a text field
            description: 'Use `HL=phrase:H0,H1,...,Hn` as a `q` parameter to search
              for a consecutive sequence of tokens in a `text: true` field.  The proxy
              tokenises the query, derives HMACs, and builds this wire format; callers
              should not construct it by hand.'
      - in: query
        name: schema
        schema:
          type: string
        description: The schema ID that this record belongs to.
      - in: query
        name: skip_count
        schema:
          type: boolean
        description: Skip the COUNT(*) query. When true, the response omits the X-Total-Count
          header and the Link rel="last" header. Useful for faster responses on large
          result sets.
      tags:
      - records
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '200':
          headers:
            X-Total-Count:
              schema:
                type: integer
              description: Total number of records matching the query (omitted when
                count is skipped).
            X-Query:
              schema:
                type: string
              description: URL-encoded q parameters echoed back on filtered queries.
                Use this value to make a follow-up count_only request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRecordList'
          description: ''
    post:
      operationId: records_create
      description: |-
        Create a new record with an already encrypted payload. This is the non-porcelain
        endpoint. If you want to create a new record with plaintext data, use the
        `record create` porcelain command or the `records ingest` command with a proxy.

        The response will be the newly created record object.

        **On the command line:**

        ```bash
        blind records create --data encrypted-record.json
        ```
      summary: Create a new record
      tags:
      - records
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/IndexedRecord'
            examples:
              MultipleRecords:
                value:
                - - data:
                      2516cdf1538b273e39bf91e67abff3a0: b94f2c9129a7b95f4003afd3cb73b55e405f7c
                      1ca62259a4f6aeefa7c54d9b13c5650d: 695d2fe4339e50f5039cfbef464846cf202fc06
                    hashed_label_map:
                      2516cdf1538b273e39bf91e67abff3a0:
                        hashed_value: b4486fe169178ec73d3dfad17227da820b89d27e1994f7
                        field_schema:
                          type: string
                      1ca62259a4f6aeefa7c54d9b13c5650d:
                        hashed_value: 8d90841201a70611da0b964a743564e035fc
                        field_schema:
                          type: number
                          minimum: 0
                          maximum: 10
                    schema: https://demo.blindinsight.io/api/schemas/abcdef012345
                summary: multiple records
              RecordWithPhrase-searchableTextField:
                value:
                - - data:
                      a3f1c2d4e5b6078910aabbccddeeff00: <AES-GCM ciphertext of note
                        field>
                    hashed_label_map:
                      a3f1c2d4e5b6078910aabbccddeeff00:
                        entries:
                        - hashed_value: c0ffee00112233
                          position: 0
                        - hashed_value: deadbeef445566
                          position: 1
                        - hashed_value: cafebabe778899
                          position: 2
                        field_schema:
                          type: string
                          text: true
                    schema: https://demo.blindinsight.io/api/schemas/abcdef012345
                summary: Text field (phrase search)
                description: 'A record whose schema contains a `text: true` string
                  field. The proxy tokenises the plaintext, derives per-token HMACs,
                  and sends them as `entries` instead of a single `hashed_value`.
                  The server indexes each token''s position for later phrase queries.'
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/IndexedRecord'
          multipart/form-data:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/IndexedRecord'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexedRecord'
              examples:
                MultipleRecords:
                  value:
                  - data:
                      2516cdf1538b273e39bf91e67abff3a0: 961298e17a97e7d0b847b8b743e179b2b
                      b92e749344f081287b034c57b7a02c77f: 695d2fe4339e50f5039cfbef464846cf202fc06
                    schema: https://demo.blindinsight.io/api/schemas/abcdef012345
                    url: https://demo.blindinsight.io/api/records/abcdef012345
                    owner: https://demo.blindinsight.io/api/users/abcdef012345
                    id: abcdef012345
                  summary: multiple records
          description: ''
    delete:
      operationId: records_bulk-destroy
      description: |-
        Delete multiple records by their IDs.

