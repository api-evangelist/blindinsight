  /api/token/:
    post:
      operationId: token_create
      description: |-
        Create a new token for the user with the given email and password. On success,
        returns a JSON web token which can be used in the `Authorization` header to make
        API requests.

        The response will be an JSON object with the access and refresh tokens.

        **On the command line:**

        ```bash
        blind token create --data '{"email": "demo@example.com", "password": "pass1234"}'
        ```
      summary: Create a new token
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/refresh/:
    post:
      operationId: token_refresh
      description: |-
        Refresh an existing token. On success, returns a JSON web token which can be
        used in the `Authorization` header to make API requests.

        The response will be an JSON object with the new access token.

        **On the command line:**

        ```bash
        blind token refresh --data '{"refresh": "<refresh-token>"}'
        ```
      summary: Refresh a token
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/token/verify/:
    post:
      operationId: token_verify
      description: |-
        Verify an access or refresh token is valid.

        The response will be an empty object if it is valid, or a 401 unauthorized error
        if it is not.

        **On the command line:**

        ```bash
        blind token verify --data '{"token": "<access-or-refresh-token>"}'
        ```
      summary: Verify a token
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerify'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenVerify'
          description: ''
  /api/users/:
    get:
      operationId: users_list
      description: |-
        Retrieve a list of users. You can filter the list by providing query parameters.
        Only users that you have access to will be returned, which in practice means
        they are in the same organization.

        The response will be a list of user objects.

        **On the command line:**

        ```bash
        blind users list
        ```
      summary: Retrieve one or more User objects, with filters
      parameters:
      - in: query
        name: date_joined
        schema:
          type: string
          format: date-time
      - in: query
        name: email
        schema:
          type: array
          items:
            type: string
        explode: true
        style: form
      - in: query
        name: first_name
        schema:
          type: string
        description: First name (optional)
      - in: query
        name: has_identity
        schema:
          type: boolean
        description: Filter by whether the user has an identity.
      - in: query
        name: id
        schema:
          type: string
      - in: query
        name: is_active
        schema:
          type: boolean
        description: Designates whether this user should be treated as active. Unselect
          this instead of deleting accounts.
      - in: query
        name: is_staff
        schema:
          type: boolean
        description: Designates whether the user can log into this admin site.
      - in: query
        name: is_superuser
        schema:
          type: boolean
        description: Designates that this user has all permissions without explicitly
          assigning them.
      - in: query
        name: last_login
        schema:
          type: string
          format: date-time
      - in: query
        name: last_name
        schema:
          type: string
        description: Last name (optional)
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - users
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
    post:
      operationId: users_create
      description: |-
        Create a new user.

        The response will be the newly created user object.

        **On the command line:**

        ```bash
        blind users create --data user.json
        ```
      summary: Create a new User
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/users/{id}/:
    get:
      operationId: users_retrieve
      description: |-
        Retrieve a single user by their ID.

        The response will be the user object.

        **On the command line:**

        ```bash
        blind users retrieve --id "<user-id>"
        ```
      summary: Retrieve one User object
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this user.
        required: true
      tags:
      - users
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: users_update
      description: |-
        Update an entire existing user, replacing all fields.

        The response will be the updated user object.

        **On the command line:**

        ```bash
        blind users update --id "<user-id>" --data user.json
        ```
      summary: Update a User
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this user.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: users_partial-update
      description: |-
        Update an existing user with only the specified fields.

        The response will be the updated user object.

        **On the command line:**

        ```bash
        blind users partial-update --id "<user-id>" --data user-update.json
        ```
      summary: Partially update a User
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this user.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    delete:
      operationId: users_destroy
      description: |-
        Delete an existing user by their ID.

        The response will be a 204 No Content if successful.

        **On the command line:**

        ```bash
        blind users destroy --id "<user-id>"
        ```
      summary: Delete a User
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this user.
        required: true
      tags:
      - users
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/users/by_name/{email}/:
    get:
      operationId: users_by-name
      description: |-
        Retrieve a single user by their name (email).

        The response will be the user object.

        **On the command line:**

        ```bash
        blind users by-name --email "<user-name>"
        ```
      summary: Retrieve one User object by name
      parameters:
      - in: path
        name: email
        schema:
          type: string
        required: true
      tags:
      - users
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/users/self/:
    get:
      operationId: users_self
      description: |-
        Retrieve the currently authenticated user.

        The response will be the user object.

        **On the command line:**

        ```bash
        blind users self
        ```
      summary: Retrieve current user
      tags:
      - users
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/ws/jobs/{job_id}/:
    get:
      operationId: jobs_websocket
      description: |-
        Connect to a job status websocket by its ID.

        **On the command line:**

        ```bash
        blind jobs websocket --id "<job-id>"
        ```
      summary: Connect to a job status websocket (only available via proxy)
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
          format: uuid
        description: The job ID to get the status of.
        required: true
      tags:
      - ws
      security:
      - cookieAuth: []
      - basicAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  processed:
                    type: integer
                  total:
                    type: integer
                  current_batch:
                    type: integer
                  total_batches:
                    type: integer
                  error:
                    type: string
          description: Job status
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
          description: Job not found
components:
  schemas:
    AccountVerified:
      type: object
      properties:
        detail:
          type: string
          default: User verified successfully
    AccountVerifiedError:
      type: object
      properties:
        detail:
          type: string
          default: <Error message>
    ActionEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      type: integer
      description: |-
        * `0` - create
        * `1` - update
        * `2` - delete
        * `3` - access
    AuditLogEntry:
      type: object
      description: Serializer for the AuditLogEntry model.
      properties:
        id:
          type: integer
          readOnly: true
        model:
          type: string
        object_pk:
          type: string
          maxLength: 255
        object_repr:
          type: string
          title: Object representation
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          minimum: 0
          maximum: 32767
        changes_text:
          type: string
          title: Change message
        changes:
          type: object
          nullable: true
          title: Change message
        cid:
          type: string
          nullable: true
          title: Correlation ID
          maxLength: 255
        remote_addr:
          type: string
          nullable: true
          title: Remote address
        remote_port:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        timestamp:
          type: string
          format: date-time
        actor_email:
          type: string
          nullable: true
          maxLength: 254
        actor:
          type: string
          nullable: true
      required:
      - action
      - id
      - model
      - object_pk
      - object_repr
    BlindLLMDemoRequest:
      type: object
      description: Public demo request — prompt plus an optional model selector.
      properties:
        prompt:
          type: string
          maxLength: 1000
        model:
          type: string
          default: ''
          maxLength: 64
        client_proxy:
          type: string
          default: ''
          maxLength: 64
        demo_user_id:
          type: string
          default: ''
          maxLength: 128
      required:
      - prompt
    BlindLLMDemoResponse:
      type: object
      description: Public demo response — slim subset of `BlindLLMQuery`.
      properties:
        ok:
          type: boolean
        answer:
          type: string
        used_tool:
          type: string
          nullable: true
        schemas_queried:
          type: array
          items:
            type: string
        fallback:
          type: boolean
        fallback_reason:
          type: string
          nullable: true
        provider_error:
          type: object
          additionalProperties:
            type: string
          nullable: true
        data_mode:
          type: string
        duration_ms:
          type: integer
        model:
          type: string
        client_proxy:
          type: string
        request_id:
          type: string
      required:
      - answer
      - client_proxy
      - data_mode
      - duration_ms
      - fallback
      - fallback_reason
      - model
      - ok
      - request_id
      - schemas_queried
      - used_tool
    BlindLLMInspectResponse:
      type: object
      description: Public catalog inspect response consumed by the dot-com hero.
      properties:
        datasets:
          type: array
          items:
            type: object
        catalog_snapshot_at:
          type: string
      required:
      - catalog_snapshot_at
      - datasets
    BlindLLMQuery:
      type: object
      description: Read-side serializer for `BlindLLMQuery`.
      properties:
        id:
          type: string
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        organization:
          type: string
          readOnly: true
        created_by:
          type: string
          readOnly: true
        prompt:
          type: string
          readOnly: true
          description: The user's question to the analyst.
        hints:
          type: object
          readOnly: true
          description: Dataset hints extracted from `@<slug>` mentions in the prompt.
            Passed to the LLM as soft direction; not enforced.
        response:
          type: string
          readOnly: true
          description: The final narrative returned by the orchestrator.
        used_tool:
          type: string
          readOnly: true
          description: Comma-separated tool names invoked during this query.
        schemas_queried:
          type: object
          readOnly: true
          description: '`dataset/schema` strings the LLM ran aggregates against.'
        tool_payload:
          type: object
          readOnly: true
          description: Tool call payloads keyed by `<tool>:<turn>`.
        fallback:
          type: boolean
          readOnly: true
          description: True when the orchestrator returned its safe fallback message.
        fallback_reason:
          type: string
          readOnly: true
          description: If fallback is True, the underlying error message.
        data_mode:
          allOf:
          - $ref: '#/components/schemas/DataModeEnum'
          readOnly: true
          description: |-
            `proxy` when the org's Cloud Proxy was used; `mock` otherwise.

            * `proxy` - proxy
            * `mock` - mock
        duration_ms:
          type: integer
          readOnly: true
          nullable: true
          description: Total orchestrator wall-clock duration in milliseconds.
        created:
          type: string
          format: date-time
          readOnly: true
      required:
      - created
      - created_by
      - data_mode
      - duration_ms
      - fallback
      - fallback_reason
      - hints
      - id
      - organization
      - prompt
      - response
      - schemas_queried
      - tool_payload
      - url
      - used_tool
    BlindLLMQueryCreate:
      type: object
      description: |-
        Write-side serializer — caller supplies `organization` + `prompt`.

        `@<slug>` mentions in the prompt are parsed server-side into `hints`.
        Optional `model` selects the LLM provider (openai / anthropic / gemini).
      properties:
        organization:
          type: string
        prompt:
          type: string
          maxLength: 4000
        model:
          type: string
          default: ''
          maxLength: 64
      required:
      - organization
      - prompt
    ChangePassword:
      type: object
      properties:
        old_password:
          type: string
        password:
          type: string
        password_confirm:
          type: string
          writeOnly: true
      required:
      - old_password
      - password
      - password_confirm
    DataModeEnum:
      enum:
      - proxy
      - mock
      type: string
      description: |-
        * `proxy` - proxy
        * `mock` - mock
    Dataset:
      type: object
      description: HyperlinkedModelSerializer with `id` as the first field.
      properties:
        id:
          type: string
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        organization:
          type: string
          format: uri
        name:
          type: string
          description: A human-readable name for this dataset.
          maxLength: 127
        slug:
          type: string
          description: A unique slug for this dataset.
          maxLength: 127
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          description: A longer description of the dataset.
          maxLength: 255
      required:
      - id
      - name
      - organization
      - url
    DefaultLogin:
      type: object
      description: |-
        Default serializer used for user login. Please keep in mind that
        the authentication is done by separate function defined by
        :ref:`login-authenticator-setting` setting.

        By default :ref:`login-authenticator-setting` function will use
        :ref:`user-login-fields-setting` setting to extract the login field
        from the validated serializer data either by using the 'login' key
        (which is used here) or the specific login field name(s)
        (e.g. 'username', 'email').

        If you want different behavior, you need to
        override :ref:`login-authenticator-setting` in your settings.
      properties:
        login:
          type: string
        password:
          type: string
      required:
      - login
      - password
    DefaultRegisterEmail:
      type: object
      description: Default serializer used for e-mail registration (e-mail change).
      properties:
        email:
          type: string
          format: email
      required:
      - email
    DefaultSendResetPasswordLink:
      type: object
      description: |-
        Default serializer used for sending reset password link.

        It will use :ref:`send-reset-password-link-serializer-use-email-setting`
        setting.
      properties:
        email:
          type: string
      required:
      - email
    DefaultUserProfile:
      type: object
      description: |-
        Default serializer used for user profile. It will use these:

        * User fields
        * :ref:`user-hidden-fields-setting` setting
        * :ref:`user-public-fields-setting` setting
        * :ref:`user-editable-fields-setting` setting

        to automagically generate the required serializer fields.
      properties:
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        id:
          type: string
          readOnly: true
        first_name:
          type: string
          description: First name (optional)
          maxLength: 150
        last_name:
          type: string
          description: Last name (optional)
          maxLength: 150
      required:
      - email
      - id
    Grant:
      type: object
      description: HyperlinkedModelSerializer with `id` as the first field.
      properties:
        id:
          type: string
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        organization:
          type: string
          format: uri
        teams:
          type: array
          items:
            type: string
            format: uri
        name:
          type: string
          description: A human-readable name for this grant.
          maxLength: 255
        codename:
          type: string
          description: The codename for this grant.
          maxLength: 100
        field_names:
          type: object
          nullable: true
          description: 'Field names of keys to request. None means allows all fields
            & query key; or a mapping of specific field names: `{''field_name'': True,
            ...}`'
        can_share_keys:
          type: boolean
          description: Whether this permission allows the user to share the key(s)
            assigned to this permission.
        can_create_records:
          type: boolean
          description: Whether this permission allows the user to create records.
        dataset:
          type: string
          format: uri
          description: The dataset that this grant belongs to.
        schema:
          type: string
          format: uri
          description: The schema that this grant belongs to.
      required:
      - codename
      - dataset
      - id
      - name
      - organization
      - schema
      - teams
      - url
    Identity:
      type: object
      description: HyperlinkedModelSerializer with `id` as the first field.
      properties:
        id:
          type: string
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        user:
          type: string
          format: uri
        device_id:
          type: string
          description: The device ID associated with this identity.
          maxLength: 255
        primary_public_key:
          type: string
          description: The primary PGP key for the identity.
        sub_public_key:
          type: string
          description: The PGP sub-key for the identity.
      required:
      - device_id
      - id
      - primary_public_key
      - sub_public_key
      - url
      - user
    IndexedRecord:
      type: object
      description: Serializer for creating a Record and creating the schema index
        values together.
      properties:
        id:
          type: string
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        schema:
          type: string
          format: uri
        hashed_label_map:
          type: object
          example:
            b92e749344f081287b034c57b7a02c77f:
              hashed_value: b4486fe169178ec73d3dfad17227da820b89d27e1994f7
              field_schema:
                type: string
            961298e17a97e7d0b847b8b743e179b2b:
              hashed_value: 8d90841201a70611da0b964a743564e035fc
              field_schema:
                type: number
                minimum: 0
                maximum: 10
          additionalProperties:
            type: object
            properties:
