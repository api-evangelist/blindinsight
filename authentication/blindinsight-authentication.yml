notes: >-
  Three authentication methods are documented. JWT Bearer is recommended for
  production: obtain a token pair via POST /api/token/, send the access token as
  `Authorization: Bearer <access_token>`, and refresh via POST /api/token/refresh/.
  HTTP Basic sends `Authorization: Basic <base64(email:password)>` on every request
  and is the default used by the local Blind Proxy and the blind-ml library.
  Session/cookie auth uses a `sessionid` cookie after POST /api/accounts/login/,
  with a CSRF token from GET /api/csrf/. All endpoints require credentials on every
  request except the public GET /api/status/ health check.
