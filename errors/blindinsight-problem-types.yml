notes: >-
  Derived from the 4xx/5xx responses declared across 127 operations in the Blind
  Insight OpenAPI. Errors are returned as application/json (not RFC 9457
  problem+json). Several codes are Blind Insight / Blind Proxy specific: 412/460
  guard the resumable TUS file-upload flow, and 422 surfaces client-side
  encrypt/decrypt failures from the local proxy. HTTP 460 is a non-standard,
  provider-defined status used for upload checksum mismatch.
